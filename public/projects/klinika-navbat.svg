<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" fill="none" role="img" aria-label="Klinika Navbat appointment queue illustration">
  <defs>
    <linearGradient id="bg" x1="60" y1="40" x2="1520" y2="1080" gradientUnits="userSpaceOnUse">
      <stop stop-color="#052E2B"/>
      <stop offset="0.5" stop-color="#0E8F7E"/>
      <stop offset="1" stop-color="#0B6FA8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1180 180) rotate(135) scale(700 580)" gradientUnits="userSpaceOnUse">
