<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" fill="none" role="img" aria-label="FitKundalik fitness tracker illustration">
  <defs>
    <linearGradient id="bg" x1="80" y1="40" x2="1520" y2="1080" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4C0B24"/>
      <stop offset="0.5" stop-color="#D91E48"/>
      <stop offset="1" stop-color="#FF9A62"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1180 160) rotate(135) scale(720 580)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD1A8" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#FFD1A8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="-50" x2="300" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE3CF"/>
      <stop offset="0.5" stop-color="#E8B49C"/>
      <stop offset="1" stop-color="#B76C58"/>
    </linearGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" stroke="#fff" stroke-opacity="0.055"/>
    </pattern>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#fff" fill-opacity="0.15"/>
    </pattern>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="30" stdDeviation="32" flood-color="#2A0712" flood-opacity="0.55"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1600" height="1100" fill="url(#bg)"/>
  <rect width="1600" height="1100" fill="url(#grid)"/>
  <rect width="1600" height="1100" fill="url(#dots)" opacity="0.4"/>
  <ellipse cx="1190" cy="160" rx="660" ry="500" fill="url(#glow)"/>

  <!-- pulse line -->
  <path d="M-40 880H250L292 840L330 920L376 780L424 880H680L718 846L748 906L790 810L834 880H1040L1080 840L1114 916L1158 800L1200 880H1660" stroke="#fff" stroke-opacity="0.13" stroke-width="4" stroke-linejoin="round"/>

  <!-- streak card -->
  <g filter="url(#shadow)">
    <rect x="194" y="292" width="304" height="206" rx="30" fill="#2A0D1A" fill-opacity="0.7" stroke="#fff" stroke-opacity="0.14"/>
    <circle cx="248" cy="350" r="26" fill="#FFB37A" fill-opacity="0.18"/>
    <path d="M248 330C258 342 264 352 264 362C264 372 257 380 248 380C239 380 232 372 232 362C232 354 238 346 248 336V330Z" fill="#FFB37A"/>
    <text x="290" y="344" fill="#fff" fill-opacity="0.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2">STREAK</text>
    <text x="290" y="374" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">7 kun</text>

    <g>
      <circle cx="238" cy="428" r="10" fill="#C6F24E"/>
      <circle cx="276" cy="428" r="10" fill="#C6F24E"/>
      <circle cx="314" cy="428" r="10" fill="#C6F24E"/>
      <circle cx="352" cy="428" r="10" fill="#C6F24E"/>
      <circle cx="390" cy="428" r="10" fill="#C6F24E"/>
      <circle cx="428" cy="428" r="10" fill="#C6F24E"/>
      <circle cx="466" cy="428" r="10" fill="#C6F24E"/>
    </g>
    <rect x="226" y="456" width="248" height="8" rx="4" fill="#fff" fill-opacity="0.1"/>
    <rect x="226" y="456" width="210" height="8" rx="4" fill="#FFB37A"/>
  </g>

  <!-- dumbbell -->
  <g transform="translate(220 584) rotate(-18)" filter="url(#shadow)">
    <ellipse cx="130" cy="130" rx="220" ry="30" fill="#2A0712" fill-opacity="0.4" filter="url(#soft)"/>
    <rect x="34" y="4" width="212" height="26" rx="13" fill="url(#metal)"/>
    <rect x="-44" y="-58" width="54" height="160" rx="18" fill="#35101E"/>
    <rect x="-24" y="-38" width="24" height="120" rx="10" fill="#FFB37A" fill-opacity="0.3"/>
    <rect x="264" y="-58" width="54" height="160" rx="18" fill="#35101E"/>
    <rect x="280" y="-38" width="24" height="120" rx="10" fill="#FFB37A" fill-opacity="0.3"/>
    <rect x="-62" y="-38" width="26" height="120" rx="12" fill="#18070E"/>
    <rect x="308" y="-38" width="26" height="120" rx="12" fill="#18070E"/>
    <rect x="64" y="-8" width="70" height="46" rx="10" fill="#2A0D1A" fill-opacity="0.35"/>
  </g>

  <!-- phone -->
  <g filter="url(#shadow)">
    <rect x="780" y="136" width="466" height="828" rx="70" fill="#1B0B12"/>
    <rect x="800" y="158" width="426" height="784" rx="54" fill="#120810"/>
    <rect x="934" y="178" width="158" height="34" rx="17" fill="#1B0B12"/>

    <!-- status -->
    <text x="834" y="204" fill="#fff" fill-opacity="0.55" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">9:41</text>
    <g fill="#fff" fill-opacity="0.45">
      <rect x="1136" y="192" width="4" height="8" rx="1"/>
      <rect x="1144" y="188" width="4" height="12" rx="1"/>
      <rect x="1152" y="184" width="4" height="16" rx="1"/>
      <rect x="1168" y="188" width="18" height="10" rx="3"/>
    </g>

    <!-- header -->
    <text x="834" y="274" fill="#C6F24E" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="3">FITKUNDALIK</text>
    <text x="834" y="320" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">Bugun</text>
    <circle cx="1164" cy="300" r="25" fill="#fff" fill-opacity="0.08"/>
    <circle cx="1164" cy="294" r="8" fill="#FFB37A"/>
    <path d="M1148 314C1148 305 1154 300 1164 300C1174 300 1180 305 1180 314" fill="#FFB37A"/>

    <!-- activity rings -->
    <g transform="translate(1013 468)">
      <circle r="96" stroke="#fff" stroke-opacity="0.08" stroke-width="20"/>
      <circle r="96" stroke="#FF4D6D" stroke-width="20" stroke-linecap="round" stroke-dasharray="428 604" transform="rotate(-90)"/>
      <circle r="68" stroke="#fff" stroke-opacity="0.08" stroke-width="20"/>
      <circle r="68" stroke="#FFA94D" stroke-width="20" stroke-linecap="round" stroke-dasharray="296 428" transform="rotate(-90)"/>
      <circle r="40" stroke="#fff" stroke-opacity="0.08" stroke-width="20"/>
      <circle r="40" stroke="#C6F24E" stroke-width="20" stroke-linecap="round" stroke-dasharray="174 252" transform="rotate(-90)"/>
      <text y="12" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" text-anchor="middle">7</text>
      <text y="38" fill="#fff" fill-opacity="0.45" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="2">KUN</text>
    </g>

    <!-- weekly chart -->
    <g transform="translate(834 624)">
      <text x="0" y="0" fill="#fff" fill-opacity="0.45" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2">HAFTALIK FAOLLIK</text>
      <g>
        <rect x="0" y="44" width="30" height="64" rx="10" fill="#fff" fill-opacity="0.14"/>
        <rect x="58" y="30" width="30" height="78" rx="10" fill="#fff" fill-opacity="0.14"/>
        <rect x="116" y="52" width="30" height="56" rx="10" fill="#fff" fill-opacity="0.14"/>
        <rect x="174" y="18" width="30" height="90" rx="10" fill="#fff" fill-opacity="0.14"/>
        <rect x="232" y="38" width="30" height="70" rx="10" fill="#fff" fill-opacity="0.14"/>
        <rect x="290" y="8" width="30" height="100" rx="10" fill="#C6F24E"/>
        <rect x="348" y="46" width="30" height="62" rx="10" fill="#fff" fill-opacity="0.14"/>
      </g>
      <g fill="#fff" fill-opacity="0.35" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="middle">
        <text x="15" y="130">DU</text>
        <text x="73" y="130">SE</text>
        <text x="131" y="130">CH</text>
        <text x="189" y="130">PA</text>
        <text x="247" y="130">JU</text>
        <text x="305" y="130" fill="#C6F24E">SH</text>
        <text x="363" y="130">YA</text>
      </g>
    </g>

    <!-- workout card -->
    <g>
      <rect x="834" y="790" width="358" height="86" rx="24" fill="#fff" fill-opacity="0.06"/>
      <circle cx="878" cy="833" r="24" fill="#FF4D6D" fill-opacity="0.18"/>
      <path d="M868 842L876 826L884 836L892 820L900 842" stroke="#FF9A62" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="918" y="826" fill="#fff" fill-opacity="0.45" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2">YUGURISH</text>
      <text x="918" y="854" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">5.2 km · 32 daq</text>
    </g>

    <!-- bottom nav -->
    <g fill="#fff" fill-opacity="0.28">
      <circle cx="864" cy="910" r="6"/>
      <circle cx="954" cy="910" r="6"/>
      <circle cx="1044" cy="910" r="6" fill="#C6F24E"/>
      <circle cx="1134" cy="910" r="6"/>
    </g>
  </g>

  <rect x="0" y="820" width="1600" height="280" fill="#2A0712" opacity="0.1"/>
</svg>
