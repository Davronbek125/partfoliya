<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" fill="none" role="img" aria-label="Kino streaming platform illustration">
  <defs>
    <linearGradient id="bg" x1="80" y1="20" x2="1540" y2="1080" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1038"/>
      <stop offset="0.48" stop-color="#3B1C8C"/>
      <stop offset="1" stop-color="#C0266E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1180 180) rotate(135) scale(720 600)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF7AC3" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FF7AC3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="poster" x1="720" y1="300" x2="1220" y2="780" gradientUnits="userSpaceOnUse">
      <stop stop-color="#132A78"/>
      <stop offset="0.52" stop-color="#7426A8"/>
      <stop offset="1" stop-color="#F0447C"/>
    </linearGradient>
    <linearGradient id="card1" x1="220" y1="320" x2="420" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#12C2E9"/>
      <stop offset="1" stop-color="#7B5CFF"/>
    </linearGradient>
    <linearGradient id="card2" x1="1360" y1="340" x2="1520" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7B733"/>
      <stop offset="1" stop-color="#FC4A1A"/>
    </linearGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" stroke="#fff" stroke-opacity="0.055"/>
    </pattern>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="30" stdDeviation="34" flood-color="#06051B" flood-opacity="0.55"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <rect width="1600" height="1100" fill="url(#bg)"/>
  <rect width="1600" height="1100" fill="url(#grid)"/>
  <ellipse cx="1190" cy="180" rx="650" ry="500" fill="url(#glow)"/>

  <!-- spotlight beams -->
  <path d="M480 -40L760 1100H300L160 -40H480Z" fill="#fff" fill-opacity="0.035"/>
  <path d="M1160 -40L1460 1100H1020L860 -40H1160Z" fill="#fff" fill-opacity="0.028"/>

  <!-- floating poster left -->
  <g transform="rotate(-8 320 480)" filter="url(#shadow)">
    <rect x="212" y="300" width="216" height="336" rx="22" fill="url(#card1)"/>
    <circle cx="320" cy="404" r="52" fill="#fff" fill-opacity="0.18"/>
    <path d="M300 376L350 404L300 432V376Z" fill="#fff" fill-opacity="0.9"/>
    <rect x="236" y="492" width="130" height="14" rx="7" fill="#fff" fill-opacity="0.75"/>
    <rect x="236" y="518" width="86" height="10" rx="5" fill="#fff" fill-opacity="0.4"/>
    <rect x="236" y="568" width="168" height="36" rx="18" fill="#0A1038" fill-opacity="0.35"/>
    <text x="320" y="591" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="2">TOP 10</text>
  </g>

  <!-- floating poster right -->
  <g transform="rotate(8 1450 500)" filter="url(#shadow)">
    <rect x="1356" y="340" width="190" height="300" rx="22" fill="url(#card2)"/>
    <circle cx="1451" cy="430" r="38" fill="#fff" fill-opacity="0.2"/>
    <path d="M1436 408L1472 430L1436 452V408Z" fill="#fff" fill-opacity="0.9"/>
    <rect x="1378" y="500" width="112" height="12" rx="6" fill="#fff" fill-opacity="0.7"/>
    <rect x="1378" y="522" width="72" height="9" rx="4" fill="#fff" fill-opacity="0.38"/>
  </g>

  <!-- player window -->
  <g filter="url(#shadow)">
    <rect x="456" y="204" width="940" height="600" rx="36" fill="#070716" fill-opacity="0.86" stroke="#fff" stroke-opacity="0.14"/>
    <path d="M456 240C456 220 472 204 492 204H1360C1380 204 1396 220 1396 240V270H456V240Z" fill="#fff" fill-opacity="0.05"/>
    <circle cx="496" cy="237" r="7" fill="#FF5A5A"/>
    <circle cx="520" cy="237" r="7" fill="#FFD45E"/>
    <circle cx="544" cy="237" r="7" fill="#67E8A5"/>
    <rect x="608" y="220" width="430" height="34" rx="17" fill="#fff" fill-opacity="0.07"/>
    <circle cx="630" cy="237" r="6" stroke="#fff" stroke-opacity="0.45" stroke-width="2"/>
    <path d="M626 241L630 237L634 241" stroke="#fff" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round"/>
    <text x="656" y="243" fill="#fff" fill-opacity="0.42" font-family="Arial, Helvetica, sans-serif" font-size="14">Qidirish...</text>
    <rect x="1254" y="220" width="104" height="34" rx="17" fill="#FF7AC3" fill-opacity="0.18"/>
    <text x="1306" y="243" fill="#FFB8D9" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle">KINO</text>

    <!-- hero poster -->
    <rect x="480" y="292" width="892" height="436" rx="22" fill="url(#poster)"/>
    <circle cx="1120" cy="410" r="128" fill="#FFBE5C" fill-opacity="0.32"/>
    <circle cx="1120" cy="410" r="82" fill="#FFD9A0" fill-opacity="0.4"/>
    <path d="M480 728L716 500L850 620L1010 452L1372 728H480Z" fill="#0A1038" fill-opacity="0.3"/>
    <path d="M480 728L760 560L920 680L1090 540L1372 728H480Z" fill="#0A1038" fill-opacity="0.26"/>
    <path d="M480 728L630 610L790 710L980 590L1372 728H480Z" fill="#06051B" fill-opacity="0.32"/>

    <!-- play button -->
    <circle cx="926" cy="504" r="82" fill="#fff" fill-opacity="0.94"/>
    <circle cx="926" cy="504" r="98" stroke="#fff" stroke-opacity="0.28"/>
    <path d="M904 462L970 504L904 546V462Z" fill="#18102E"/>

    <!-- title bars -->
    <rect x="516" y="654" width="270" height="18" rx="9" fill="#fff" fill-opacity="0.8"/>
    <rect x="516" y="686" width="180" height="10" rx="5" fill="#fff" fill-opacity="0.38"/>
    <rect x="1208" y="654" width="126" height="34" rx="17" fill="#0A1038" fill-opacity="0.45"/>
    <text x="1271" y="676" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle">DAVOM ETISH</text>

    <!-- film strip -->
    <rect x="480" y="748" width="892" height="36" rx="8" fill="#03030C" fill-opacity="0.55"/>
    <g fill="#fff" fill-opacity="0.35">
      <rect x="500" y="758" width="18" height="14" rx="4"/>
      <rect x="544" y="758" width="18" height="14" rx="4"/>
      <rect x="588" y="758" width="18" height="14" rx="4"/>
      <rect x="632" y="758" width="18" height="14" rx="4"/>
      <rect x="676" y="758" width="18" height="14" rx="4"/>
      <rect x="720" y="758" width="18" height="14" rx="4"/>
      <rect x="764" y="758" width="18" height="14" rx="4"/>
      <rect x="808" y="758" width="18" height="14" rx="4"/>
      <rect x="852" y="758" width="18" height="14" rx="4"/>
      <rect x="896" y="758" width="18" height="14" rx="4"/>
      <rect x="940" y="758" width="18" height="14" rx="4"/>
      <rect x="984" y="758" width="18" height="14" rx="4"/>
      <rect x="1028" y="758" width="18" height="14" rx="4"/>
      <rect x="1072" y="758" width="18" height="14" rx="4"/>
      <rect x="1116" y="758" width="18" height="14" rx="4"/>
      <rect x="1160" y="758" width="18" height="14" rx="4"/>
      <rect x="1204" y="758" width="18" height="14" rx="4"/>
      <rect x="1248" y="758" width="18" height="14" rx="4"/>
      <rect x="1292" y="758" width="18" height="14" rx="4"/>
      <rect x="1336" y="758" width="18" height="14" rx="4"/>
    </g>
  </g>

  <!-- streaming chip -->
  <g filter="url(#shadow)">
    <rect x="584" y="850" width="304" height="66" rx="33" fill="#0A1038" fill-opacity="0.7" stroke="#fff" stroke-opacity="0.18"/>
    <circle cx="622" cy="883" r="8" fill="#FF7AC3"/>
    <text x="646" y="890" fill="#fff" fill-opacity="0.8" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="2">NOW STREAMING</text>
  </g>

  <!-- film reel -->
  <g opacity="0.35" transform="translate(1430 880)">
    <circle r="62" stroke="#fff" stroke-width="8"/>
    <circle r="16" stroke="#fff" stroke-width="6"/>
    <circle cx="0" cy="-38" r="12" stroke="#fff" stroke-width="6"/>
    <circle cx="33" cy="20" r="12" stroke="#fff" stroke-width="6"/>
    <circle cx="-33" cy="20" r="12" stroke="#fff" stroke-width="6"/>
  </g>

  <rect x="0" y="790" width="1600" height="310" fill="#06051B" opacity="0.1"/>
</svg>
