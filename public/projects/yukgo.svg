<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" fill="none" role="img" aria-label="YukGO logistics illustration">
  <defs>
    <linearGradient id="bg" x1="120" y1="80" x2="1500" y2="1040" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF7A18"/>
      <stop offset="0.48" stop-color="#D94A7A"/>
      <stop offset="1" stop-color="#3B1B63"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1240 210) rotate(135) scale(760 620)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE7B8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFE7B8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" stroke="#fff" stroke-opacity="0.07"/>
    </pattern>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#1A092B" flood-opacity="0.38"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <rect width="1600" height="1100" fill="url(#bg)"/>
  <rect width="1600" height="1100" fill="url(#grid)"/>
  <ellipse cx="1230" cy="220" rx="620" ry="470" fill="url(#glow)"/>

  <!-- topographic map lines -->
  <g stroke="#fff" stroke-opacity="0.13" stroke-width="2">
    <path d="M-60 230C170 150 290 280 440 235C620 180 690 40 900 80C1110 120 1160 250 1360 220C1480 202 1570 140 1660 160"/>
    <path d="M-40 320C170 240 300 370 470 315C650 257 730 120 930 160C1130 200 1210 330 1400 300C1500 284 1580 230 1660 250"/>
    <path d="M-60 920C120 830 300 940 470 890C650 837 730 720 920 750C1120 782 1210 930 1400 880C1490 857 1580 800 1660 820"/>
    <path d="M-60 1010C140 920 300 1030 500 975C690 922 760 820 960 850C1160 880 1240 1020 1420 970C1510 945 1590 900 1660 915"/>
  </g>

  <!-- route chip -->
  <g filter="url(#shadow)">
    <rect x="560" y="112" width="430" height="86" rx="43" fill="#2A113F" fill-opacity="0.72" stroke="#fff" stroke-opacity="0.22"/>
    <circle cx="610" cy="155" r="9" fill="#C6F24E"/>
    <text x="638" y="164" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" letter-spacing="3">TAS</text>
    <path d="M704 155H790" stroke="#fff" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round" stroke-dasharray="3 12"/>
    <path d="M784 143L802 155L784 167" stroke="#fff" stroke-opacity="0.7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="824" y="164" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" letter-spacing="3">SAM</text>
    <circle cx="930" cy="155" r="9" fill="#FFB37A"/>
  </g>

  <!-- route -->
  <path d="M286 806C430 700 540 690 650 742C780 804 850 680 940 610C1030 540 1080 470 1168 402" stroke="#FFF7ED" stroke-opacity="0.5" stroke-width="6" stroke-linecap="round" stroke-dasharray="18 20"/>
  <path d="M286 806C430 700 540 690 650 742C780 804 850 680 940 610C1030 540 1080 470 1168 402" stroke="#FFD9A8" stroke-opacity="0.35" stroke-width="18" stroke-linecap="round" stroke-dasharray="18 20" filter="url(#soft)"/>

  <!-- start pin -->
  <g filter="url(#shadow)">
    <path d="M286 742C286 709 313 682 346 682C379 682 406 709 406 742C406 787 346 840 346 840C346 840 286 787 286 742Z" fill="#FFF7ED"/>
    <circle cx="346" cy="740" r="22" fill="#FF5A3C"/>
    <text x="286" y="900" fill="#fff" fill-opacity="0.8" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="4">TAS</text>
  </g>

  <!-- end pin -->
  <g filter="url(#shadow)">
    <path d="M1110 348C1110 315 1137 288 1170 288C1203 288 1230 315 1230 348C1230 393 1170 446 1170 446C1170 446 1110 393 1110 348Z" fill="#FFF7ED"/>
    <circle cx="1170" cy="346" r="22" fill="#7B5CFF"/>
    <text x="1092" y="506" fill="#fff" fill-opacity="0.8" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="4">SAM</text>
  </g>

  <!-- floating cargo cubes -->
  <g opacity="0.9">
    <path d="M430 238L490 204L550 238L490 272L430 238Z" fill="#FFE3C4" fill-opacity="0.9"/>
    <path d="M430 238V294L490 328V272L430 238Z" fill="#FFB37A"/>
    <path d="M550 238V294L490 328V272L550 238Z" fill="#FF8A5C"/>
    <path d="M1268 612L1318 584L1368 612L1318 640L1268 612Z" fill="#FFE3C4" fill-opacity="0.85"/>
    <path d="M1268 612V656L1318 684V640L1268 612Z" fill="#FFB37A"/>
    <path d="M1368 612V656L1318 684V640L1368 612Z" fill="#FF8A5C"/>
  </g>

  <!-- truck -->
  <g transform="translate(610 420)" filter="url(#shadow)">
    <ellipse cx="310" cy="326" rx="292" ry="28" fill="#1A092B" fill-opacity="0.38" filter="url(#soft)"/>

    <!-- motion lines -->
    <g stroke="#FFF7ED" stroke-opacity="0.34" stroke-width="7" stroke-linecap="round">
      <path d="M-18 116H54"/>
      <path d="M-46 160H44"/>
      <path d="M-8 204H58"/>
    </g>

    <!-- cargo box -->
    <rect x="18" y="62" width="372" height="216" rx="24" fill="#FFF7ED"/>
    <rect x="18" y="62" width="372" height="216" rx="24" stroke="#2A113F" stroke-opacity="0.12"/>
    <rect x="18" y="188" width="372" height="18" fill="#FF5A3C"/>
    <path d="M330 62V278" stroke="#2A113F" stroke-opacity="0.16" stroke-width="3"/>
    <path d="M348 62V278" stroke="#2A113F" stroke-opacity="0.1" stroke-width="3"/>
    <circle cx="60" cy="92" r="7" fill="#FF5A3C"/>
    <text x="56" y="158" fill="#FF5A3C" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" letter-spacing="1">YUKGO</text>
    <text x="58" y="184" fill="#2A113F" fill-opacity="0.5" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="5">CARGO NETWORK</text>

    <!-- cab -->
    <path d="M390 118H486C506 118 522 129 531 148L568 226C574 240 577 254 577 268V286H390V118Z" fill="#FFF7ED"/>
    <path d="M390 118H486C506 118 522 129 531 148L568 226C574 240 577 254 577 268V286H390V118Z" stroke="#2A113F" stroke-opacity="0.12"/>
    <path d="M414 140H478L514 214H414V140Z" fill="#15233D"/>
    <path d="M430 148H468L488 184H430V148Z" fill="#8CCBFF" fill-opacity="0.28"/>
    <path d="M390 240H577V286H390V240Z" fill="#FF8A5C" fill-opacity="0.28"/>
    <rect x="560" y="246" width="30" height="40" rx="8" fill="#2A113F"/>
    <rect x="398" y="100" width="54" height="12" rx="6" fill="#FFB37A"/>

    <!-- wheels -->
    <circle cx="112" cy="286" r="52" fill="#251438"/>
    <circle cx="112" cy="286" r="23" fill="#C9B8D8"/>
    <circle cx="112" cy="286" r="9" fill="#251438"/>
    <circle cx="476" cy="286" r="52" fill="#251438"/>
    <circle cx="476" cy="286" r="23" fill="#C9B8D8"/>
    <circle cx="476" cy="286" r="9" fill="#251438"/>
  </g>

  <!-- small map dots -->
  <g fill="#FFF7ED" fill-opacity="0.55">
    <circle cx="510" cy="590" r="5"/>
    <circle cx="560" cy="540" r="4"/>
    <circle cx="980" cy="760" r="5"/>
    <circle cx="1040" cy="720" r="4"/>
    <circle cx="1340" cy="740" r="5"/>
    <circle cx="1420" cy="790" r="4"/>
  </g>

  <!-- soft bottom vignette -->
  <rect x="0" y="760" width="1600" height="340" fill="url(#glow)" opacity="0.12"/>
</svg>
